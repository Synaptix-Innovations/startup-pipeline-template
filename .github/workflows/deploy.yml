name: Deploy

# Manual trigger only: a human decides when production changes. Combine with a
# GitHub "environment" that requires approval for a second pair of eyes.
on:
  workflow_dispatch:

jobs:
  verify:
    name: full CI before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm run lint
      - run: npm test

  deploy:
    name: deploy + post-deploy health check
    needs: verify
    runs-on: ubuntu-latest
    # Create an environment named "production" in repo settings and add a
    # required reviewer — that turns this into a true deploy gate.
    environment: production
    steps:
