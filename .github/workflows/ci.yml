name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing and costs free-tier minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + test + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # Zero dependencies — nothing to install. When you add deps: npm ci here.

      - name: Lint (syntax check)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Credentials are cheap to leak and expensive to rotate. This runs on
      # every pull request so a pasted key never reaches main.
      - name: Secret scan
        run: bash scripts/secret-scan.sh

      # A real smoke: boot the app and hit /health. If your app can't answer
      # a health check in CI, it won't answer one in production either.
      # A real smoke: boot the app, hit /health, AND fetch every asset the page
      # references. A 200 from /health only proves the process is up; it does
      # not prove the page works (docs/CASE-STUDIES.md, case 2).
      - name: Smoke (health + assets)
        run: |
          npm start &
          APP_PID=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          bash scripts/smoke.sh http://127.0.0.1:3000
          RC=$?
          kill $APP_PID 2>/dev/null || true
          exit $RC
